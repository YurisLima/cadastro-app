<form  #loginForm="ngForm" (submit)="submit(loginForm)" >
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Faça Login</h3>
            <form>
              <!-- Campo de Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" [(ngModel)]="Usuario.email" #email="ngModel" required placeholder="Digite seu login" />
              <div *ngIf="email.invalid && email.dirty " class="text-danger">
                O email é obrigatório.
              </div>
            </div>
                <!-- Campo de Senha -->
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" name="password" [(ngModel)]="Usuario.password" #password="ngModel" required placeholder="Digite sua senha" />
              <div *ngIf="(password.invalid && password.touched) || (password.invalid && loginForm.submitted)" class="text-danger">
                A senha é obrigatória.
              </div>

            </div>
            <!-- Botão -->
            <div class="d-grid">
              <button type="submit" (click)="submit(loginForm)" class="btn btn-primary">Entrar</button>
            </div>
            </form>
            <p class="mt-3 text-center">
              Não tem uma conta? <a routerLink="/cadastro-login">Cadastre-se</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
